{% extends "base.html" %}

{% block content %}
<div x-data="statusPage()" x-init="loadData(); setInterval(loadData, 3000)">
    <!-- Worker Control Panel -->
    <div class="card p-4 mb-6 opacity-0 animate-slide-up">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div class="w-3 h-3 rounded-full transition-colors duration-300"
                             :class="workerPaused ? 'bg-yellow' : 'bg-green animate-pulse-subtle'"></div>
                        <div class="absolute inset-0 rounded-full animate-ping opacity-30"
                             :class="workerPaused ? 'bg-yellow' : 'bg-green'"
                             x-show="!workerPaused"></div>
                    </div>
                    <div>
                        <span class="text-xs font-mono text-text-muted uppercase tracking-wider">Worker</span>
                        <p class="text-sm font-semibold" :class="workerPaused ? 'text-yellow' : 'text-green'"
                           x-text="workerPaused ? 'Paused' : 'Running'"></p>
                    </div>
                </div>

                <div class="h-8 w-px bg-surface-1"></div>

                <div class="flex items-center gap-2 text-sm text-text-sub">
                    <span class="font-mono" x-text="activeJobsCount"></span>
                    <span class="text-text-muted">active</span>
                    <span class="text-text-muted">/</span>
                    <span class="font-mono" x-text="pausedJobsCount"></span>
                    <span class="text-text-muted">paused</span>
                    <span class="text-text-muted">/</span>
                    <span class="font-mono" x-text="pendingJobsCount"></span>
                    <span class="text-text-muted">pending</span>
                </div>
            </div>

            <button @click="toggleWorker()"
                    class="flex-shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200"
                    :class="workerPaused
                        ? 'bg-green/10 text-green hover:bg-green/20 border border-green/30'
                        : 'bg-yellow/10 text-yellow hover:bg-yellow/20 border border-yellow/30'">
                <span class="flex items-center gap-2">
                    <svg x-show="workerPaused" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <svg x-show="!workerPaused" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                    <span x-text="workerPaused ? 'Resume Worker' : 'Pause Worker'"></span>
                </span>
            </button>
        </div>
    </div>

    <!-- Status Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <!-- GPU Status -->
        <div class="card p-5 opacity-0 animate-slide-up stagger-1">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-2 h-2 rounded-full" :class="gpuAvailable ? 'bg-green animate-pulse-subtle' : 'bg-text-muted'"></div>
                <span class="text-xs font-mono text-text-muted uppercase tracking-wider">GPU</span>
            </div>
            <p class="text-2xl font-bold text-text" x-text="gpuAvailable ? 'Available' : 'CPU Mode'"></p>
            <p class="text-xs text-text-muted mt-1 font-mono" x-text="gpuInfo"></p>
        </div>

        <!-- Active Jobs -->
        <div class="card p-5 opacity-0 animate-slide-up stagger-2">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-2 h-2 rounded-full" :class="activeJobsCount > 0 ? 'bg-yellow animate-pulse' : 'bg-text-muted'"></div>
                <span class="text-xs font-mono text-text-muted uppercase tracking-wider">Active Jobs</span>
            </div>
            <p class="text-2xl font-bold text-text" x-text="activeJobsCount"></p>
            <p class="text-xs text-text-muted mt-1">Processing</p>
        </div>

        <!-- Documents -->
        <div class="card p-5 opacity-0 animate-slide-up stagger-3">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-2 h-2 rounded-full bg-blue"></div>
                <span class="text-xs font-mono text-text-muted uppercase tracking-wider">Vector Store</span>
            </div>
            <p class="text-2xl font-bold text-text" x-text="totalDocuments"></p>
            <p class="text-xs text-text-muted mt-1">Documents indexed</p>
        </div>
    </div>

    <!-- Jobs Table -->
    <div class="card p-5 mb-6 opacity-0 animate-slide-up stagger-4">
        <div class="flex items-center justify-between mb-5">
            <h3 class="text-sm font-mono font-semibold text-text-muted uppercase tracking-wider">Job Queue</h3>
            <div class="flex gap-1 bg-surface-0 p-1 rounded-lg">
                <button @click="filterStatus = ''" :class="filterStatus === '' ? 'bg-blue text-crust' : 'text-text-muted hover:text-text'" class="px-3 py-1.5 rounded text-xs font-medium transition-colors">All</button>
                <button @click="filterStatus = 'running'" :class="filterStatus === 'running' ? 'bg-yellow text-crust' : 'text-text-muted hover:text-text'" class="px-3 py-1.5 rounded text-xs font-medium transition-colors">Running</button>
                <button @click="filterStatus = 'paused'" :class="filterStatus === 'paused' ? 'bg-peach text-crust' : 'text-text-muted hover:text-text'" class="px-3 py-1.5 rounded text-xs font-medium transition-colors">Paused</button>
                <button @click="filterStatus = 'pending'" :class="filterStatus === 'pending' ? 'bg-surface-2 text-text' : 'text-text-muted hover:text-text'" class="px-3 py-1.5 rounded text-xs font-medium transition-colors">Pending</button>
                <button @click="filterStatus = 'failed'" :class="filterStatus === 'failed' ? 'bg-red text-crust' : 'text-text-muted hover:text-text'" class="px-3 py-1.5 rounded text-xs font-medium transition-colors">Failed</button>
            </div>
        </div>

        <table class="w-full">
            <thead>
                <tr class="text-left">
                    <th class="pb-3 text-xs font-mono font-medium text-text-muted uppercase tracking-wider w-24">Status</th>
                    <th class="pb-3 text-xs font-mono font-medium text-text-muted uppercase tracking-wider w-20">Priority</th>
                    <th class="pb-3 text-xs font-mono font-medium text-text-muted uppercase tracking-wider">Type</th>
                    <th class="pb-3 text-xs font-mono font-medium text-text-muted uppercase tracking-wider">Source</th>
                    <th class="pb-3 text-xs font-mono font-medium text-text-muted uppercase tracking-wider w-40">Progress</th>
                    <th class="pb-3 text-xs font-mono font-medium text-text-muted uppercase tracking-wider w-32">Started</th>
                    <th class="pb-3 w-28"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-surface-0">
                <template x-for="job in filteredJobs" :key="job.id">
                    <tr class="group hover:bg-surface-0/30 transition-colors">
                        <td class="py-3">
                            <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-xs font-mono"
                                  :class="{
                                      'bg-green/10 text-green': job.status === 'completed',
                                      'bg-yellow/10 text-yellow': job.status === 'running',
                                      'bg-peach/10 text-peach': job.status === 'paused',
                                      'bg-red/10 text-red': job.status === 'failed',
                                      'bg-surface-0 text-text-muted': job.status === 'pending' || job.status === 'cancelled'
                                  }">
                                <span class="w-1.5 h-1.5 rounded-full" :class="{
                                    'bg-green': job.status === 'completed',
                                    'bg-yellow animate-pulse': job.status === 'running',
                                    'bg-peach': job.status === 'paused',
                                    'bg-red': job.status === 'failed',
                                    'bg-text-muted': job.status === 'pending' || job.status === 'cancelled'
                                }"></span>
                                <span x-text="job.status"></span>
                            </span>
                        </td>
                        <td class="py-3">
                            <div class="flex items-center gap-1" x-show="job.status === 'pending' || job.status === 'paused'">
                                <button @click="adjustPriority(job.id, 10)"
                                        class="p-1 text-text-muted hover:text-green hover:bg-green/10 rounded transition-all"
                                        title="Increase priority">
                                    <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                                </button>
                                <span class="text-xs font-mono text-text-sub w-6 text-center" x-text="job.priority || 50"></span>
                                <button @click="adjustPriority(job.id, -10)"
                                        class="p-1 text-text-muted hover:text-red hover:bg-red/10 rounded transition-all"
                                        title="Decrease priority">
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                            <span x-show="job.status !== 'pending' && job.status !== 'paused'"
                                  class="text-xs font-mono text-text-muted" x-text="job.priority || 50"></span>
                        </td>
                        <td class="py-3 text-sm text-text-sub font-mono" x-text="formatJobType(job.job_type)"></td>
                        <td class="py-3 text-sm text-text-sub max-w-[200px] truncate" x-text="job.current_item || job.source_url || job.source_path || '-'"></td>
                        <td class="py-3">
                            <div class="flex items-center gap-2">
                                <div class="w-20 h-1.5 bg-surface-0 rounded-full overflow-hidden">
                                    <div class="h-full transition-all duration-500"
                                         :class="job.status === 'paused' ? 'bg-gradient-to-r from-peach to-yellow' : 'bg-gradient-to-r from-peach to-yellow'"
                                         :style="`width: ${job.total_items > 0 ? (job.progress / job.total_items * 100) : 0}%`"></div>
                                </div>
                                <span class="text-xs text-text-muted font-mono" x-text="`${job.progress}/${job.total_items}`"></span>
                            </div>
                        </td>
                        <td class="py-3 text-sm text-text-muted" x-text="formatDate(job.started_at || job.created_at)"></td>
                        <td class="py-3">
                            <div class="flex items-center gap-1 justify-end">
                                <!-- Pause button for running/pending jobs -->
                                <button x-show="job.status === 'running' || job.status === 'pending'"
                                        @click="pauseJob(job.id)"
                                        class="opacity-0 group-hover:opacity-100 p-1.5 text-text-muted hover:text-yellow hover:bg-yellow/10 rounded transition-all"
                                        title="Pause job">
                                    <i data-lucide="pause" class="w-4 h-4"></i>
                                </button>

                                <!-- Resume button for paused jobs -->
                                <button x-show="job.status === 'paused'"
                                        @click="resumeJob(job.id)"
                                        class="p-1.5 text-green hover:bg-green/10 rounded transition-all animate-pulse-subtle"
                                        title="Resume job">
                                    <i data-lucide="play" class="w-4 h-4"></i>
                                </button>

                                <!-- Cancel button -->
                                <button x-show="job.status === 'running' || job.status === 'pending' || job.status === 'paused'"
                                        @click="cancelJob(job.id)"
                                        class="opacity-0 group-hover:opacity-100 p-1.5 text-text-muted hover:text-red hover:bg-red/10 rounded transition-all"
                                        title="Cancel job">
                                    <i data-lucide="x-circle" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <div x-show="filteredJobs.length === 0" class="text-center py-8 text-text-muted text-sm">
            No jobs found
        </div>
    </div>

    <!-- Monitored Channels -->
    <div class="card p-5 opacity-0 animate-slide-up stagger-5">
        <h3 class="text-sm font-mono font-semibold text-text-muted uppercase tracking-wider mb-5">Monitored Channels</h3>

        <div class="space-y-3">
            <template x-for="channel in channels" :key="channel.id">
                <div class="flex items-center gap-4 p-4 bg-surface-0/50 rounded-lg hover:bg-surface-0 transition-colors">
                    <div class="w-10 h-10 rounded-lg bg-red/10 flex items-center justify-center">
                        <i data-lucide="youtube" class="w-5 h-5 text-red"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-medium text-text text-sm" x-text="channel.channel_name"></p>
                        <p class="text-xs text-text-muted font-mono" x-text="`${channel.video_count} videos`"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-text-muted">Last checked</p>
                        <p class="text-xs text-text-sub font-mono" x-text="channel.last_checked_at ? formatDate(channel.last_checked_at) : 'Never'"></p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full" :class="channel.is_active ? 'bg-green' : 'bg-text-muted'"></span>
                        <span class="text-xs text-text-muted" x-text="channel.is_active ? 'Active' : 'Paused'"></span>
                    </div>
                </div>
            </template>

            <div x-show="channels.length === 0" class="text-center py-8 text-text-muted text-sm">
                No channels being monitored
            </div>
        </div>
    </div>
</div>

<script>
function statusPage() {
    return {
        jobs: [],
        channels: [],
        gpuAvailable: false,
        gpuInfo: 'Checking...',
        totalDocuments: 0,
        filterStatus: '',
        workerPaused: false,

        get activeJobsCount() {
            return this.jobs.filter(j => j.status === 'running').length;
        },

        get pausedJobsCount() {
            return this.jobs.filter(j => j.status === 'paused').length;
        },

        get pendingJobsCount() {
            return this.jobs.filter(j => j.status === 'pending').length;
        },

        get filteredJobs() {
            if (!this.filterStatus) return this.jobs;
            return this.jobs.filter(j => j.status === this.filterStatus);
        },

        formatJobType(type) {
            const types = {
                'youtube_video': 'YT Video',
                'youtube_channel': 'YT Channel',
                'youtube_channel_check': 'YT Check',
                'document_upload': 'Document',
                'website_scrape': 'Website'
            };
            return types[type] || type;
        },

        async loadData() {
            try {
                const [jobsRes, channelsRes, catsRes, workerRes] = await Promise.all([
                    fetch('/api/jobs?limit=50'),
                    fetch('/api/youtube/channels'),
                    fetch('/api/categories'),
                    fetch('/api/worker/status')
                ]);

                this.jobs = await jobsRes.json();
                this.channels = await channelsRes.json();
                const cats = await catsRes.json();
                const workerStatus = await workerRes.json();

                this.totalDocuments = cats.reduce((sum, c) => sum + c.item_count, 0);
                this.workerPaused = workerStatus.paused;
                this.gpuAvailable = false;
                this.gpuInfo = 'Using CPU';
                setTimeout(() => lucide.createIcons(), 0);
            } catch (e) {
                console.error('Failed to load data:', e);
            }
        },

        formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString();
        },

        async toggleWorker() {
            const endpoint = this.workerPaused ? '/api/worker/resume' : '/api/worker/pause';
            await fetch(endpoint, { method: 'POST' });
            this.loadData();
        },

        async pauseJob(jobId) {
            await fetch(`/api/jobs/${jobId}/pause`, { method: 'POST' });
            this.loadData();
        },

        async resumeJob(jobId) {
            await fetch(`/api/jobs/${jobId}/resume`, { method: 'POST' });
            this.loadData();
        },

        async cancelJob(jobId) {
            await fetch(`/api/jobs/${jobId}/cancel`, { method: 'POST' });
            this.loadData();
        },

        async adjustPriority(jobId, delta) {
            const job = this.jobs.find(j => j.id === jobId);
            if (!job) return;

            const newPriority = Math.max(0, Math.min(100, (job.priority || 50) + delta));
            await fetch(`/api/jobs/${jobId}/priority`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ priority: newPriority })
            });
            this.loadData();
        }
    }
}
</script>
{% endblock %}
